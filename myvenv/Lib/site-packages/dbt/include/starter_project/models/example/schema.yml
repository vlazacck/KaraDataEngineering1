version: 2

sources:
  - name: public
    schema: public
    tables:
      - name: raw_telegram_data
        description: "Raw data scraped from Telegram channels"
        columns:
          - name: channel_name
            description: "Name of the Telegram channel"
          - name: message_id
            description: "Unique identifier for the message"
          - name: message_text
            description: "Text content of the message"
          - name: media_link
            description: "Link to any attached media"
          - name: media_type
            description: "Type of media (e.g., photo, video)"
          - name: timestamp
            description: "Timestamp of the message"

# Define models (transformed data)
models:
- name: cleaned_telegram_data
    description: "Cleaned data from the raw_telegram_data table"
    columns:
      - name: channel_name
        description: "Name of the Telegram channel"
      - name: message_id
        description: "Unique identifier for the message"
      - name: message_text
        description: "Text content of the message"
      - name: media_link
        description: "Link to any attached media"
      - name: media_type
        description: "Type of media (e.g., photo, video)"
      - name: timestamp
        description: "Timestamp of the message"

  - name: my_first_dbt_model
    description: "A starter dbt model"
    columns:
      - name: id
        description: "The primary key for this table"
        tests:
          - unique
          - not_null

  - name: my_second_dbt_model
    description: "A starter dbt model"
    columns:
      - name: id
        description: "The primary key for this table"
        tests:
          - unique
          - not_null